name: Daily News Report

# 每天北京时间 9:00 触发 (UTC 1:00)
on:
  schedule:
    - cron: '0 1 * * *'  # UTC 1:00 = 北京时间 9:00
  workflow_dispatch:  # 支持手动触发测试

jobs:
  trigger-daily-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Daily Report
        run: |
          echo "📅 开始触发每日资讯日报推送..."
          echo "⏰ 触发时间: $(date '+%Y-%m-%d %H:%M:%S')"
          
          # 触发日报推送
          response=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            "${{ secrets.COZE_SERVICE_URL }}/trigger/daily_report")
          
          echo "📡 响应结果:"
          echo "$response"
          
          # 检查是否成功
          if echo "$response" | grep -q '"code":0'; then
            echo "✅ 日报推送成功!"
          else
            echo "❌ 日报推送失败，请检查日志"
            exit 1
          fi
